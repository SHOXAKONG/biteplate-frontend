name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names. github.repository_owner preserves the
  # case of the GitHub handle, so we lowercase it in a step and reference
  # ${{ steps.owner.outputs.lc }} when tagging the image.
  VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://api.62.113.58.138.nip.io/api/v1' }}

jobs:
  build-test:
    name: Install & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE: ${{ env.VITE_API_BASE }}

  build-and-push:
    name: Build & push image
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.owner.outputs.lc }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo owner (GHCR requires lowercase)
        id: owner
        run: echo "lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=${{ env.VITE_API_BASE }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/biteplate-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/biteplate-frontend:latest

  deploy:
    name: Deploy to K8s
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      - name: Apply manifests
        run: kubectl apply -f k8s/
      - name: Roll out
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
          OWNER: ${{ needs.build-and-push.outputs.owner }}
        run: |
          kubectl -n biteplate-frontend set image deploy/biteplate-frontend \
            frontend=${{ env.REGISTRY }}/${OWNER}/biteplate-frontend:${TAG}
          kubectl -n biteplate-frontend rollout status deploy/biteplate-frontend --timeout=180s
