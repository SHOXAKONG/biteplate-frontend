apiVersion: apps/v1
kind: Deployment
metadata:
  name: biteplate-frontend
  namespace: biteplate-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biteplate-frontend
  template:
    metadata:
      labels:
        app: biteplate-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/shoxakong/biteplate-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: biteplate-frontend
  namespace: biteplate-frontend
spec:
  selector:
    app: biteplate-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biteplate-frontend
  namespace: biteplate-frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.62.113.58.145.nip.io
      secretName: app-biteplate-tls
  rules:
    - host: app.62.113.58.145.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: biteplate-frontend
                port:
                  number: 80
